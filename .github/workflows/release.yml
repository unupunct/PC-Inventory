name: Release

# Builds every release artifact on a tag (v*) and attaches it to a GitHub
# release. Nothing here signs anything; the workflow only compiles and packages
# exactly the same scripts you can run locally (scripts/build.sh).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.1.0"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Go vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build Linux artifacts
        if: matrix.target == 'linux'
        shell: bash
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh "${{ steps.ver.outputs.version }}"
          ls -la dist

      - name: Build .deb and .rpm
        if: matrix.target == 'linux'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          which nfpm || go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cp "dist/pcim-server-linux-amd64" dist/server-binary
          cp "dist/pcim-agent-linux-amd64" dist/agent-binary
          PCIM_VERSION="$VERSION" PCIM_ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb --target dist/
          PCIM_VERSION="$VERSION" PCIM_ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p rpm --target dist/
          ls -la dist

      - name: Build Windows artifacts
        if: matrix.target == 'windows'
        shell: powershell
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./scripts/build-windows.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: pcim-${{ matrix.target }}-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/pcim-agent-macos-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
